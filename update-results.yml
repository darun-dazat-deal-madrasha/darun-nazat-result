name: Update Result Data from Excel

on:
  push:
    paths:
      - "excel/**"
      - "build_results.py"
      - "bijoy2unicode.py"
      - ".github/workflows/update-results.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Excel reader
        run: pip install -r requirements.txt

      - name: Build result data
        run: python build_results.py

      - name: Commit generated result data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/manifest.json
          if git diff --cached --quiet; then
            echo "No result-data changes to commit."
          else
            git commit -m "Update result data from Excel"
            git push
          fi
